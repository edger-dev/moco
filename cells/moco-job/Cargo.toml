[package]
name = "moco-job"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
moco-core = { workspace = true }
facet = { workspace = true }
facet-styx = { workspace = true }

# Only for `openpty`, whose nix wrapper is safe — this crate adds no `unsafe`.
# The pty's *slave* is handed to `std::process::Command` as stdio, so every
# existing child, reap and kill path keeps working unchanged.
nix = { version = "0.31", features = ["term"] }
vt100 = "0.16.2"
